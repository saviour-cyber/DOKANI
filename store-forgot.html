<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Dokani Store</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Inter Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col justify-center items-center p-4 relative">

  <!-- Background decorative element -->
  <div class="absolute inset-0 bg-[radial-gradient(#e2e8f0_1px,transparent_1px)] [background-size:16px_16px] pointer-events-none opacity-60"></div>

  <div class="w-full max-w-md bg-white border border-slate-200/90 rounded-3xl shadow-xl shadow-slate-200/50 p-8 sm:p-10 relative z-10">
    
    <!-- Brand Header -->
    <div class="text-center mb-6">
      <a href="/store" class="inline-flex items-center gap-2 mb-3 group">
        <div class="w-11 h-11 rounded-2xl bg-indigo-600 text-white font-black text-2xl flex items-center justify-center shadow-lg shadow-indigo-100 group-hover:bg-indigo-700 transition-colors">
          d
        </div>
        <span class="text-2xl font-black text-slate-900 tracking-tight">Dokani</span>
      </a>
      <h1 class="text-xl font-bold text-slate-900 tracking-tight">Forgot Password</h1>
      <p class="text-xs text-slate-500 mt-1 font-medium">Enter your registered email address and we'll send you instructions to reset your password.</p>
    </div>

    <!-- Alert Box -->
    <div id="alert-box" class="hidden mb-6 p-4 rounded-2xl text-xs font-semibold flex items-start gap-2.5">
      <i id="alert-icon" data-lucide="alert-circle" class="w-4 h-4 flex-shrink-0 mt-0.5"></i>
      <div id="alert-message" class="flex-1"></div>
    </div>

    <!-- Forgot Password Form -->
    <form id="forgot-form" onsubmit="handleForgot(event)" class="space-y-4">
      <div>
        <label for="forgot-email" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Email Address</label>
        <div class="relative">
          <i data-lucide="mail" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input
            id="forgot-email"
            type="email"
            required
            placeholder="Enter your registered email address"
            class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all font-medium"
          >
        </div>
      </div>

      <button
        id="forgot-submit-btn"
        type="submit"
        class="w-full mt-2 py-3 px-4 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white font-bold text-sm rounded-xl transition-all shadow-md shadow-indigo-100 flex items-center justify-center gap-2"
      >
        <span>Send Reset Link</span>
        <i data-lucide="send" class="w-4 h-4"></i>
      </button>
    </form>

    <!-- Return to Login -->
    <div class="mt-6 pt-5 border-t border-slate-100 text-center">
      <a href="/store/login" class="inline-flex items-center gap-1.5 text-xs font-bold text-indigo-600 hover:text-indigo-800 transition-colors">
        <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
        <span>Back to Login</span>
      </a>
    </div>

  </div>

  <script>
    lucide.createIcons();

    function showAlert(msg, isError = true) {
      const box = document.getElementById('alert-box');
      const msgEl = document.getElementById('alert-message');
      const iconEl = document.getElementById('alert-icon');
      
      box.className = isError
        ? 'mb-6 p-4 rounded-2xl text-xs font-semibold flex items-start gap-2.5 bg-red-50 border border-red-200 text-red-700'
        : 'mb-6 p-4 rounded-2xl text-xs font-semibold flex items-start gap-2.5 bg-emerald-50 border border-emerald-200 text-emerald-700';

      iconEl.setAttribute('data-lucide', isError ? 'alert-circle' : 'check-circle-2');
      msgEl.textContent = msg;
      box.classList.remove('hidden');
      lucide.createIcons();
    }

    async function handleForgot(e) {
      e.preventDefault();
      const email = document.getElementById('forgot-email').value.trim();
      const btn = document.getElementById('forgot-submit-btn');

      if (!email) {
        showAlert('Please enter your email.');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = `Sending...`;

      try {
        const res = await fetch('/api/customer/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });

        const data = await res.json();
        showAlert(data.message || 'Reset instructions sent if email exists.', false);
        btn.disabled = false;
        btn.innerHTML = `<span>Send Reset Link</span> <i data-lucide="send" class="w-4 h-4"></i>`;
        lucide.createIcons();
      } catch (err) {
        showAlert('Something went wrong. Please try again later.');
        btn.disabled = false;
        btn.innerHTML = `<span>Send Reset Link</span> <i data-lucide="send" class="w-4 h-4"></i>`;
        lucide.createIcons();
      }
    }
  </script>
</body>
</html>
