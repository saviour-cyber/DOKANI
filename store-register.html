<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Customer Account — Dokani Store</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Inter Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col justify-center items-center p-4 relative py-12">

  <!-- Background decorative element -->
  <div class="absolute inset-0 bg-[radial-gradient(#e2e8f0_1px,transparent_1px)] [background-size:16px_16px] pointer-events-none opacity-60"></div>

  <div class="w-full max-w-md bg-white border border-slate-200/90 rounded-3xl shadow-xl shadow-slate-200/50 p-8 sm:p-10 relative z-10">
    
    <!-- Brand Header -->
    <div class="text-center mb-6">
      <a href="/store" class="inline-flex items-center gap-2 mb-3 group">
        <div class="w-11 h-11 rounded-2xl bg-indigo-600 text-white font-black text-2xl flex items-center justify-center shadow-lg shadow-indigo-100 group-hover:bg-indigo-700 transition-colors">
          d
        </div>
        <span class="text-2xl font-black text-slate-900 tracking-tight">Dokani</span>
      </a>
      <h1 class="text-xl font-bold text-slate-900 tracking-tight">Create Account</h1>
      <p class="text-xs text-slate-500 mt-1 font-medium">Join Dokani to track orders, save wishlist items & enjoy seamless checkout</p>
    </div>

    <!-- Alert Box -->
    <div id="alert-box" class="hidden mb-5 p-4 rounded-2xl text-xs font-semibold flex items-start gap-2.5">
      <i id="alert-icon" data-lucide="alert-circle" class="w-4 h-4 flex-shrink-0 mt-0.5"></i>
      <div id="alert-message" class="flex-1"></div>
    </div>

    <!-- Registration Form -->
    <form id="customer-register-form" onsubmit="handleRegister(event)" class="space-y-4">
      
      <!-- Full Name -->
      <div>
        <label for="reg-name" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Full Name</label>
        <div class="relative">
          <i data-lucide="user" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input
            id="reg-name"
            type="text"
            required
            placeholder="e.g. Amina Hassan"
            class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all font-medium"
          >
        </div>
      </div>

      <!-- Phone Number -->
      <div>
        <label for="reg-phone" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Phone Number (M-Pesa / Delivery)</label>
        <div class="relative">
          <i data-lucide="phone" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input
            id="reg-phone"
            type="tel"
            required
            placeholder="0712 345 678 or 0110 123 456"
            class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all font-medium"
          >
        </div>
        <p class="text-[11px] text-slate-400 mt-1">Used for M-Pesa payments and courier delivery notifications.</p>
      </div>

      <!-- Email Address -->
      <div>
        <label for="reg-email" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Email Address</label>
        <div class="relative">
          <i data-lucide="mail" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input
            id="reg-email"
            type="email"
            required
            placeholder="amina.h@example.co.ke"
            class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all font-medium"
          >
        </div>
      </div>

      <!-- Password -->
      <div>
        <label for="reg-password" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Password</label>
        <div class="relative">
          <i data-lucide="lock" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input
            id="reg-password"
            type="password"
            required
            minlength="6"
            oninput="checkPasswordStrength(this.value)"
            placeholder="Minimum 6 characters"
            class="w-full pl-10 pr-10 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all font-medium"
          >
          <button type="button" onclick="togglePasswordVisibility('reg-password', 'eye-1')" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
            <i id="eye-1" data-lucide="eye" class="w-4 h-4"></i>
          </button>
        </div>
        
        <!-- Strength Meter -->
        <div class="mt-2">
          <div class="w-full bg-slate-100 rounded-full h-1.5 overflow-hidden">
            <div id="strength-bar" class="bg-slate-300 h-1.5 rounded-full transition-all duration-300" style="width: 0%"></div>
          </div>
          <span id="strength-label" class="text-[10px] text-slate-400 font-medium">Strength: Enter password</span>
        </div>
      </div>

      <!-- Confirm Password -->
      <div>
        <label for="reg-confirm" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Confirm Password</label>
        <div class="relative">
          <i data-lucide="shield-check" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input
            id="reg-confirm"
            type="password"
            required
            minlength="6"
            placeholder="Re-enter password"
            class="w-full pl-10 pr-10 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all font-medium"
          >
          <button type="button" onclick="togglePasswordVisibility('reg-confirm', 'eye-2')" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
            <i id="eye-2" data-lucide="eye" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

      <!-- Terms & Conditions Checkbox -->
      <div class="pt-1">
        <label class="flex items-start gap-2 cursor-pointer">
          <input id="reg-terms" type="checkbox" checked class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 w-4 h-4 mt-0.5">
          <span class="text-xs text-slate-500">I agree to Dokani's <a href="#" class="text-indigo-600 underline">Terms of Service</a> & <a href="#" class="text-indigo-600 underline">Privacy Policy</a></span>
        </label>
      </div>

      <button
        id="reg-submit-btn"
        type="submit"
        class="w-full mt-2 py-3 px-4 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white font-bold text-sm rounded-xl transition-all shadow-md shadow-indigo-100 flex items-center justify-center gap-2"
      >
        <span>Create Customer Account</span>
        <i data-lucide="arrow-right" class="w-4 h-4"></i>
      </button>
    </form>

    <!-- Already Have Account -->
    <div class="mt-6 text-center text-xs text-slate-600">
      Already have an account?
      <a id="login-link" href="/store/login" class="text-indigo-600 font-bold hover:underline ml-1">Login</a>
    </div>

    <!-- Continue as Guest -->
    <div class="mt-4 pt-4 border-t border-slate-100 text-center">
      <a id="guest-link" href="/store" class="inline-flex items-center gap-1.5 text-xs font-semibold text-slate-500 hover:text-slate-800 transition-colors">
        <span>Continue as Guest</span>
        <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
      </a>
    </div>

  </div>

  <script>
    lucide.createIcons();

    // Preserve redirect
    const urlParams = new URLSearchParams(window.location.search);
    const redirectUrl = urlParams.get('redirect') || '/store/account';
    
    if (urlParams.get('redirect')) {
      document.getElementById('login-link').href = `/store/login?redirect=${encodeURIComponent(urlParams.get('redirect'))}`;
      if (urlParams.get('redirect') === 'checkout') {
        document.getElementById('guest-link').href = '/store?checkout=true';
      }
    }

    function togglePasswordVisibility(fieldId, iconId) {
      const input = document.getElementById(fieldId);
      const icon = document.getElementById(iconId);
      if (input.type === 'password') {
        input.type = 'text';
        icon.setAttribute('data-lucide', 'eye-off');
      } else {
        input.type = 'password';
        icon.setAttribute('data-lucide', 'eye');
      }
      lucide.createIcons();
    }

    function checkPasswordStrength(pass) {
      const bar = document.getElementById('strength-bar');
      const label = document.getElementById('strength-label');
      
      if (!pass) {
        bar.style.width = '0%';
        bar.className = 'bg-slate-300 h-1.5 rounded-full';
        label.textContent = 'Strength: Enter password';
        label.className = 'text-[10px] text-slate-400 font-medium';
        return;
      }

      let score = 0;
      if (pass.length >= 6) score += 1;
      if (pass.length >= 10) score += 1;
      if (/[A-Z]/.test(pass)) score += 1;
      if (/[0-9]/.test(pass)) score += 1;
      if (/[^A-Za-z0-9]/.test(pass)) score += 1;

      if (score <= 1) {
        bar.style.width = '25%';
        bar.className = 'bg-red-500 h-1.5 rounded-full';
        label.textContent = 'Strength: Weak';
        label.className = 'text-[10px] text-red-500 font-medium';
      } else if (score <= 3) {
        bar.style.width = '60%';
        bar.className = 'bg-amber-500 h-1.5 rounded-full';
        label.textContent = 'Strength: Medium';
        label.className = 'text-[10px] text-amber-500 font-medium';
      } else {
        bar.style.width = '100%';
        bar.className = 'bg-emerald-500 h-1.5 rounded-full';
        label.textContent = 'Strength: Strong';
        label.className = 'text-[10px] text-emerald-600 font-semibold';
      }
    }

    function showAlert(msg, isError = true) {
      const box = document.getElementById('alert-box');
      const msgEl = document.getElementById('alert-message');
      const iconEl = document.getElementById('alert-icon');
      
      box.className = isError
        ? 'mb-5 p-4 rounded-2xl text-xs font-semibold flex items-start gap-2.5 bg-red-50 border border-red-200 text-red-700'
        : 'mb-5 p-4 rounded-2xl text-xs font-semibold flex items-start gap-2.5 bg-emerald-50 border border-emerald-200 text-emerald-700';

      iconEl.setAttribute('data-lucide', isError ? 'alert-circle' : 'check-circle-2');
      msgEl.textContent = msg;
      box.classList.remove('hidden');
      lucide.createIcons();
    }

    async function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById('reg-name').value.trim();
      const phone = document.getElementById('reg-phone').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      const confirmPassword = document.getElementById('reg-confirm').value;
      const btn = document.getElementById('reg-submit-btn');

      if (!name || !phone || !email || !password) {
        showAlert('Please fill in all required fields.');
        return;
      }

      if (password.length < 6) {
        showAlert('Password must be at least 6 characters.');
        return;
      }

      if (password !== confirmPassword) {
        showAlert('Passwords do not match. Please re-enter.');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = `<svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white inline" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Creating account...`;

      try {
        const res = await fetch('/api/customer/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, phone, email, password, confirmPassword })
        });

        const data = await res.json();

        if (!res.ok) {
          showAlert(data.error || 'Registration failed. Please try again.');
          btn.disabled = false;
          btn.innerHTML = `<span>Create Customer Account</span> <i data-lucide="arrow-right" class="w-4 h-4"></i>`;
          lucide.createIcons();
          return;
        }

        showAlert('Account created successfully! Taking you to Dokani...', false);

        if (data.token) {
          localStorage.setItem('dokani_customer_token', data.token);
          localStorage.setItem('dokani_customer_user', JSON.stringify(data.account));
        }

        setTimeout(() => {
          if (redirectUrl === 'checkout') {
            window.location.href = '/store?checkout=open';
          } else {
            window.location.href = decodeURIComponent(redirectUrl);
          }
        }, 700);

      } catch (err) {
        console.error(err);
        showAlert('Network error. Please try again.');
        btn.disabled = false;
        btn.innerHTML = `<span>Create Customer Account</span> <i data-lucide="arrow-right" class="w-4 h-4"></i>`;
        lucide.createIcons();
      }
    }
  </script>
</body>
</html>
