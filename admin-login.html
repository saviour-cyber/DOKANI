<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dokani Admin Portal — Login</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Inter Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col justify-center items-center p-4 relative">

  <!-- Background decorative element -->
  <div class="absolute inset-0 bg-[radial-gradient(#e2e8f0_1px,transparent_1px)] [background-size:16px_16px] pointer-events-none opacity-50"></div>

  <div class="w-full max-w-md bg-white border border-slate-200/90 rounded-3xl shadow-xl shadow-slate-200/50 p-8 sm:p-10 relative z-10">
    <!-- Brand Header -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-indigo-600 text-white font-black text-2xl shadow-lg shadow-indigo-100 mb-4">
        d
      </div>
      <h1 class="text-2xl font-black text-slate-900 tracking-tight">Dokani Admin Portal</h1>
      <p class="text-xs text-slate-500 mt-1 font-medium">Business management & order operations</p>
    </div>

    <!-- Alert Box -->
    <div id="alert-box" class="hidden mb-6 p-4 rounded-2xl text-xs font-semibold flex items-start gap-2.5">
      <i id="alert-icon" data-lucide="alert-circle" class="w-4 h-4 flex-shrink-0 mt-0.5"></i>
      <div id="alert-message" class="flex-1"></div>
    </div>

    <!-- Login Form -->
    <form id="admin-login-form" onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label for="login-email" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Email Address</label>
        <div class="relative">
          <i data-lucide="mail" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input
            id="login-email"
            type="email"
            required
            value="admin@dokani.co.ke"
            placeholder="admin@dokani.co.ke"
            class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all font-medium"
          >
        </div>
      </div>

      <div>
        <div class="flex items-center justify-between mb-1.5">
          <label for="login-password" class="block text-xs font-bold text-slate-700 uppercase tracking-wider">Password</label>
          <button type="button" onclick="showForgotModal()" class="text-xs text-indigo-600 hover:text-indigo-700 font-semibold transition-colors">Forgot?</button>
        </div>
        <div class="relative">
          <i data-lucide="lock" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input
            id="login-password"
            type="password"
            required
            value="Admin@Dokani2026"
            placeholder="••••••••••••"
            class="w-full pl-10 pr-10 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all font-medium"
          >
          <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
            <i id="eye-icon" data-lucide="eye" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

      <div class="flex items-center justify-between pt-1">
        <label class="flex items-center gap-2 cursor-pointer">
          <input id="login-remember" type="checkbox" checked class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 w-4 h-4">
          <span class="text-xs font-medium text-slate-600">Remember me for 30 days</span>
        </label>
      </div>

      <button
        id="login-submit-btn"
        type="submit"
        class="w-full mt-2 py-3 px-4 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white font-bold text-sm rounded-xl transition-all shadow-md shadow-indigo-100 flex items-center justify-center gap-2"
      >
        <span>Sign in to Dashboard</span>
        <i data-lucide="arrow-right" class="w-4 h-4"></i>
      </button>
    </form>

    <!-- Credentials Reminder -->
    <div class="mt-8 pt-6 border-t border-slate-100 text-center text-xs text-slate-500">
      <div class="bg-indigo-50/60 border border-indigo-100 text-indigo-900 rounded-xl p-3 text-left space-y-1">
        <div class="font-bold text-[11px] text-indigo-600 uppercase tracking-wider">Default Staff Credentials:</div>
        <div>Email: <strong class="font-mono text-slate-800">admin@dokani.co.ke</strong></div>
        <div>Password: <strong class="font-mono text-slate-800">Admin@Dokani2026</strong></div>
      </div>
      <div class="mt-4">
        <a href="/store" class="text-slate-500 hover:text-indigo-600 inline-flex items-center gap-1.5 font-medium transition-colors">
          <i data-lucide="store" class="w-3.5 h-3.5"></i> Return to Customer Storefront
        </a>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();

    function togglePasswordVisibility() {
      const pwd = document.getElementById('login-password');
      const icon = document.getElementById('eye-icon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.setAttribute('data-lucide', 'eye-off');
      } else {
        pwd.type = 'password';
        icon.setAttribute('data-lucide', 'eye');
      }
      lucide.createIcons();
    }

    function showAlert(msg, isError = true) {
      const box = document.getElementById('alert-box');
      const text = document.getElementById('alert-message');
      const icon = document.getElementById('alert-icon');

      box.className = isError
        ? 'mb-6 p-4 rounded-2xl text-xs font-semibold flex items-start gap-2.5 bg-rose-50 border border-rose-200 text-rose-700'
        : 'mb-6 p-4 rounded-2xl text-xs font-semibold flex items-start gap-2.5 bg-emerald-50 border border-emerald-200 text-emerald-700';

      icon.setAttribute('data-lucide', isError ? 'alert-circle' : 'check-circle');
      text.textContent = msg;
      box.classList.remove('hidden');
      lucide.createIcons();
    }

    function showForgotModal() {
      alert("To reset password, contact your Dokani system administrator or update the password in database.");
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const remember = document.getElementById('login-remember').checked;
      const btn = document.getElementById('login-submit-btn');

      btn.disabled = true;
      btn.innerHTML = `<span class="inline-block animate-spin mr-2">◌</span> Signing in…`;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, remember })
        });

        const data = await res.json();
        if (!res.ok) {
          showAlert(data.error || 'Login failed. Please check your credentials.', true);
          btn.disabled = false;
          btn.innerHTML = `<span>Sign in to Dashboard</span><i data-lucide="arrow-right" class="w-4 h-4"></i>`;
          lucide.createIcons();
          return;
        }

        showAlert("Success! Redirecting to Dokani Admin…", false);
        setTimeout(() => {
          window.location.href = '/admin';
        }, 400);
      } catch (err) {
        showAlert("Server connection failed. Please ensure the backend is running.", true);
        btn.disabled = false;
        btn.innerHTML = `<span>Sign in to Dashboard</span><i data-lucide="arrow-right" class="w-4 h-4"></i>`;
        lucide.createIcons();
      }
    }
  </script>
</body>
</html>
