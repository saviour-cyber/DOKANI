<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Login — Dokani Store</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Inter Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col justify-center items-center p-4 relative">

  <!-- Background decorative element -->
  <div class="absolute inset-0 bg-[radial-gradient(#e2e8f0_1px,transparent_1px)] [background-size:16px_16px] pointer-events-none opacity-60"></div>

  <div class="w-full max-w-md bg-white border border-slate-200/90 rounded-3xl shadow-xl shadow-slate-200/50 p-8 sm:p-10 relative z-10">
    
    <!-- Dokani Brand Header -->
    <div class="text-center mb-8">
      <a href="/store" class="inline-flex items-center gap-2 mb-3 group">
        <div class="w-11 h-11 rounded-2xl bg-indigo-600 text-white font-black text-2xl flex items-center justify-center shadow-lg shadow-indigo-100 group-hover:bg-indigo-700 transition-colors">
          d
        </div>
        <span class="text-2xl font-black text-slate-900 tracking-tight">Dokani</span>
      </a>
      <h1 class="text-xl font-bold text-slate-900 tracking-tight">Welcome Back</h1>
      <p class="text-xs text-slate-500 mt-1 font-medium">Log in to track orders, manage your wishlist & account</p>
    </div>

    <!-- Alert Box -->
    <div id="alert-box" class="hidden mb-6 p-4 rounded-2xl text-xs font-semibold flex items-start gap-2.5">
      <i id="alert-icon" data-lucide="alert-circle" class="w-4 h-4 flex-shrink-0 mt-0.5"></i>
      <div id="alert-message" class="flex-1"></div>
    </div>

    <!-- Login Form -->
    <form id="customer-login-form" onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label for="login-identifier" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Email or Phone Number</label>
        <div class="relative">
          <i data-lucide="user" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input
            id="login-identifier"
            type="text"
            required
            placeholder="Enter your email or phone number"
            class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all font-medium"
          >
        </div>
      </div>

      <div>
        <div class="flex items-center justify-between mb-1.5">
          <label for="login-password" class="block text-xs font-bold text-slate-700 uppercase tracking-wider">Password</label>
          <a href="/store/forgot-password" class="text-xs text-indigo-600 hover:text-indigo-700 font-semibold transition-colors">Forgot Password?</a>
        </div>
        <div class="relative">
          <i data-lucide="lock" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input
            id="login-password"
            type="password"
            required
            placeholder="••••••••••••"
            class="w-full pl-10 pr-10 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all font-medium"
          >
          <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
            <i id="eye-icon" data-lucide="eye" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

      <div class="flex items-center justify-between pt-1">
        <label class="flex items-center gap-2 cursor-pointer">
          <input id="login-remember" type="checkbox" checked class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 w-4 h-4">
          <span class="text-xs font-medium text-slate-600">Remember me</span>
        </label>
      </div>

      <button
        id="login-submit-btn"
        type="submit"
        class="w-full mt-2 py-3 px-4 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white font-bold text-sm rounded-xl transition-all shadow-md shadow-indigo-100 flex items-center justify-center gap-2"
      >
        <span>Login</span>
        <i data-lucide="arrow-right" class="w-4 h-4"></i>
      </button>
    </form>

    <!-- Create Account Link -->
    <div class="mt-6 text-center text-xs text-slate-600">
      Don't have an account?
      <a id="register-link" href="/store/register" class="text-indigo-600 font-bold hover:underline ml-1">Create Account</a>
    </div>

    <!-- Continue as Guest -->
    <div class="mt-4 pt-4 border-t border-slate-100 text-center">
      <a id="guest-link" href="/store" class="inline-flex items-center gap-1.5 text-xs font-semibold text-slate-500 hover:text-slate-800 transition-colors">
        <span>Continue as Guest</span>
        <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
      </a>
    </div>


  </div>

  <script>
    lucide.createIcons();

    // Preserve redirect query parameter
    const urlParams = new URLSearchParams(window.location.search);
    const redirectUrl = urlParams.get('redirect') || '/store/account';
    
    // Update register & guest links with redirect
    if (urlParams.get('redirect')) {
      document.getElementById('register-link').href = `/store/register?redirect=${encodeURIComponent(urlParams.get('redirect'))}`;
      if (urlParams.get('redirect') === 'checkout') {
        document.getElementById('guest-link').href = '/store?checkout=true';
      }
    }

    function togglePasswordVisibility() {
      const input = document.getElementById('login-password');
      const icon = document.getElementById('eye-icon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.setAttribute('data-lucide', 'eye-off');
      } else {
        input.type = 'password';
        icon.setAttribute('data-lucide', 'eye');
      }
      lucide.createIcons();
    }

    function showAlert(msg, isError = true) {
      const box = document.getElementById('alert-box');
      const msgEl = document.getElementById('alert-message');
      const iconEl = document.getElementById('alert-icon');
      
      box.className = isError
        ? 'mb-6 p-4 rounded-2xl text-xs font-semibold flex items-start gap-2.5 bg-red-50 border border-red-200 text-red-700'
        : 'mb-6 p-4 rounded-2xl text-xs font-semibold flex items-start gap-2.5 bg-emerald-50 border border-emerald-200 text-emerald-700';

      iconEl.setAttribute('data-lucide', isError ? 'alert-circle' : 'check-circle-2');
      msgEl.textContent = msg;
      box.classList.remove('hidden');
      lucide.createIcons();
    }

    async function handleLogin(e) {
      e.preventDefault();
      const identifier = document.getElementById('login-identifier').value.trim();
      const password = document.getElementById('login-password').value;
      const remember = document.getElementById('login-remember').checked;
      const btn = document.getElementById('login-submit-btn');

      if (!identifier || !password) {
        showAlert('Please enter your email or phone and password.');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = `<svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white inline" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Logging in...`;

      try {
        const res = await fetch('/api/customer/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier, password, remember })
        });

        const data = await res.json();

        if (!res.ok) {
          showAlert(data.error || 'Login failed. Please check your credentials.');
          btn.disabled = false;
          btn.innerHTML = `<span>Login</span> <i data-lucide="arrow-right" class="w-4 h-4"></i>`;
          lucide.createIcons();
          return;
        }

        showAlert('Welcome back! Redirecting...', false);

        // Store customer token if needed for API headers
        if (data.token) {
          localStorage.setItem('dokani_customer_token', data.token);
          localStorage.setItem('dokani_customer_user', JSON.stringify(data.account));
        }

        setTimeout(() => {
          if (redirectUrl === 'checkout') {
            window.location.href = '/store?checkout=open';
          } else {
            window.location.href = decodeURIComponent(redirectUrl);
          }
        }, 600);

      } catch (err) {
        console.error(err);
        showAlert('Network error. Please try again.');
        btn.disabled = false;
        btn.innerHTML = `<span>Login</span> <i data-lucide="arrow-right" class="w-4 h-4"></i>`;
        lucide.createIcons();
      }
    }
  </script>
</body>
</html>
